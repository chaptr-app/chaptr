<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>Shelves · Chaptr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .shelves-head { margin-top: 32px; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

  .tabs { display: flex; gap: 6px; margin-top: 24px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 12px 18px; background: transparent; border: 0;
    color: var(--ink-3); font-weight: 500; font-size: .95rem;
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .shelf-section { margin-top: 28px; }
  .book-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
  }
  .shelf-row {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
    padding: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md);
  }
  .shelf-row .cover-md { width: 56px; height: 80px; border-radius: 5px; box-shadow: var(--shadow-sm); }
  .shelf-row .title { font-family: var(--serif); font-size: 1.05rem; }
  .shelf-row .meta  { color: var(--ink-3); font-size: .85rem; margin-top: 2px; }
  .shelf-row .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .move-btn {
    padding: 6px 10px; font-size: .78rem; border: 1px solid var(--border);
    border-radius: var(--r-pill); background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  .move-btn:hover { border-color: var(--primary); color: var(--primary); }
  .move-btn.current { background: var(--primary-tint); color: var(--primary); border-color: var(--primary); cursor: default; }

  .empty {
    padding: 40px 16px; text-align: center; color: var(--ink-3);
    border: 1px dashed var(--border); border-radius: var(--r-md);
  }

  /* inline review under each row */
  .review-strip {
    grid-column: 2 / 4;
    margin-top: 6px;
    padding: 10px 12px;
    background: var(--primary-tint);
    border-radius: var(--r-sm);
    font-size: .88rem;
    display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;
  }
  .review-strip .stars { color: var(--accent); font-size: 1rem; line-height: 1; }
  .review-strip .qt { color: var(--ink-2); font-style: italic; flex: 1; min-width: 200px; }
  .review-strip .when { color: var(--ink-3); font-size: .75rem; }
  .review-btn { padding: 6px 10px; font-size: .78rem; border: 1px solid var(--border);
    border-radius: var(--r-pill); background: var(--surface); color: var(--ink-2); cursor: pointer; }
  .review-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* review modal — reuse today.html's dialog vibe */
  .dlg-back { position: fixed; inset: 0; background: rgba(20,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .dlg-back.open { display: flex; }
  .dlg-card { background: var(--surface); border-radius: var(--r-lg); padding: 28px; max-width: 480px; width: 100%; box-shadow: var(--shadow-lg); }
  .dlg-card h3 { margin: 0 0 4px; }
  .star-row { display: flex; gap: 4px; font-size: 1.8rem; cursor: pointer; user-select: none; margin: 14px 0 6px; }
  .star-row .star { color: var(--surface-2); transition: color .12s; }
  .star-row .star.on { color: var(--accent); }
  .review-text { width: 100%; min-height: 90px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: var(--r-sm); font: inherit; background: var(--bg); color: var(--ink); resize: vertical; }
  .review-text:focus { outline: 0; border-color: var(--primary); background: var(--surface); }
  .dlg-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 8px; }
  .dlg-actions .right { display: flex; gap: 8px; }
  .row-actions { align-self: start; }
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">C</span> Chaptr
    </a>
    <div class="nav-links">
      <a href="today.html">Today</a>
      <a href="library.html">Library</a>
      <a href="shelves.html" class="active">Shelves</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-cta">
      <a href="library.html" class="btn btn-outline btn-sm hide-sm">Add books</a>
    </div>
  </div>
</nav>

<main class="container">

  <section class="shelves-head">
    <div>
      <div class="eyebrow">Your shelves</div>
      <h1 style="margin:6px 0 0;">All the books, sorted by you.</h1>
      <p class="muted" style="margin-top:6px;">Smart shelves arrive in V3. For now: three classics.</p>
    </div>
    <span class="pill" id="totalCount">0 books</span>
  </section>

  <div class="tabs" id="tabs">
    <button class="tab active" data-shelf="reading">Reading <span class="muted" id="cntReading">0</span></button>
    <button class="tab" data-shelf="wantToRead">Want to read <span class="muted" id="cntWant">0</span></button>
    <button class="tab" data-shelf="read">Read <span class="muted" id="cntRead">0</span></button>
  </div>

  <section class="shelf-section">
    <div id="shelfList"></div>
  </section>

</main>

<div class="dlg-back" id="reviewDlg">
  <div class="dlg-card" role="dialog" aria-modal="true">
    <div class="eyebrow">Your review</div>
    <h3 id="reviewBookTitle">Book</h3>
    <div class="muted" id="reviewBookAuthor" style="font-size:.9rem;"></div>
    <div class="star-row" id="starRow">
      <span class="star" data-star="1">★</span>
      <span class="star" data-star="2">★</span>
      <span class="star" data-star="3">★</span>
      <span class="star" data-star="4">★</span>
      <span class="star" data-star="5">★</span>
    </div>
    <div class="muted" id="ratingLabel" style="font-size:.82rem; margin-bottom:10px;">Tap a star to rate</div>
    <textarea class="review-text" id="reviewText" placeholder="A line or two — what hit, what didn't?"></textarea>
    <div class="dlg-actions">
      <button class="btn btn-ghost btn-sm" id="reviewDelete" style="visibility:hidden;">Delete</button>
      <div class="right">
        <button class="btn btn-ghost" id="reviewCancel">Cancel</button>
        <button class="btn btn-primary" id="reviewSave">Save review</button>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container row">
    <span>© Chaptr — a prototype.</span>
    <span class="muted">Time is the new star rating.</span>
  </div>
</footer>

<script src="app.js?v=7"></script>
<script>
  const { CATALOG, COVER_GRADIENTS, findBook, getShelves, moveToShelf,
          getReview, setReview, fmtDay, attachSwipe, OL } = window.Chaptr;

  function starString(rating) {
    if (!rating) return '';
    const full = Math.floor(rating);
    const half = (rating - full) >= 0.5;
    return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
  }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* image-backed covers should fill the box */
  document.head.insertAdjacentHTML('beforeend',
    `<style>.shelf-row .cover-md { background-size: cover !important; background-position: center !important; }</style>`);

  let activeShelf = 'reading';
  const shelfLabels = { reading: 'Reading', wantToRead: 'Want to read', read: 'Read' };

  function renderCounts() {
    const s = getShelves();
    document.getElementById('cntReading').textContent = s.reading.length;
    document.getElementById('cntWant').textContent = s.wantToRead.length;
    document.getElementById('cntRead').textContent = s.read.length;
    const total = s.reading.length + s.wantToRead.length + s.read.length;
    document.getElementById('totalCount').textContent = `${total} book${total === 1 ? '' : 's'}`;
  }

  function renderShelf() {
    const s = getShelves();
    const ids = s[activeShelf] || [];
    const el = document.getElementById('shelfList');
    if (!ids.length) {
      el.innerHTML = `<div class="empty">
        Nothing on this shelf yet. <a href="library.html">Browse the Library</a> to add books.
      </div>`;
      return;
    }
    el.innerHTML = ids.map((id, i) => {
      const b = findBook(id);
      const buttons = ['reading', 'wantToRead', 'read'].map(target => {
        const cls = target === activeShelf ? 'move-btn current' : 'move-btn';
        const dis = target === activeShelf ? 'disabled' : '';
        return `<button class="${cls}" data-book="${id}" data-target="${target}" ${dis}>${shelfLabels[target]}</button>`;
      }).join('') + `<button class="review-btn" data-review="${id}">${getReview(id) ? 'Edit review' : '+ Review'}</button>`;

      const rv = getReview(id);
      const reviewStrip = rv ? `<div class="review-strip">
        ${rv.rating ? `<span class="stars">${starString(rv.rating)}</span>` : ''}
        ${rv.text ? `<span class="qt">"${escapeHtml(rv.text)}"</span>` : ''}
        <span class="when">${fmtDay(rv.date.slice(0,10))}</span>
      </div>` : '';

      return `<div class="shelf-row">
        <div class="cover-md" data-shelf-cover="${i}"></div>
        <div>
          <div class="title">${escapeHtml(b.title)}</div>
          <div class="meta">${escapeHtml(b.author)} · ${b.genre} · ${b.pages}p</div>
        </div>
        <div class="row-actions">${buttons}</div>
        ${reviewStrip}
      </div>`;
    }).join('');
    ids.forEach((id, i) => {
      const node = el.querySelector(`[data-shelf-cover="${i}"]`);
      OL.applyCover(node, findBook(id), 'M');
    });
    // wire move buttons
    el.querySelectorAll('.move-btn').forEach(btn => {
      if (btn.classList.contains('current')) return;
      btn.addEventListener('click', () => {
        moveToShelf(btn.dataset.book, btn.dataset.target);
        renderCounts();
        renderShelf();
      });
    });
    // wire review buttons
    el.querySelectorAll('[data-review]').forEach(btn => {
      btn.addEventListener('click', () => openReviewDlg(btn.dataset.review));
    });
  }

  // ---------- review modal ----------
  const reviewDlg = document.getElementById('reviewDlg');
  let reviewBookId = null;
  let reviewRating = 0;
  const ratingLabels = ['', 'Hated it', 'Meh', 'It was OK', 'Really liked it', 'Loved it'];

  function paintStars() {
    document.querySelectorAll('#starRow .star').forEach(s => {
      s.classList.toggle('on', parseInt(s.dataset.star, 10) <= reviewRating);
    });
    document.getElementById('ratingLabel').textContent =
      reviewRating ? ratingLabels[reviewRating] : 'Tap a star to rate';
  }

  function openReviewDlg(bookId) {
    reviewBookId = bookId;
    const b = findBook(bookId);
    const existing = getReview(bookId);
    reviewRating = existing?.rating || 0;
    document.getElementById('reviewBookTitle').textContent = b.title;
    document.getElementById('reviewBookAuthor').textContent = b.author;
    document.getElementById('reviewText').value = existing?.text || '';
    document.getElementById('reviewDelete').style.visibility = existing ? 'visible' : 'hidden';
    paintStars();
    reviewDlg.classList.add('open');
    setTimeout(() => document.getElementById('reviewText').focus(), 50);
  }
  function closeReviewDlg() { reviewDlg.classList.remove('open'); reviewBookId = null; }

  document.querySelectorAll('#starRow .star').forEach(s => {
    s.addEventListener('click', () => {
      const n = parseInt(s.dataset.star, 10);
      reviewRating = (reviewRating === n) ? 0 : n; // tap same star to clear
      paintStars();
    });
  });
  document.getElementById('reviewCancel').addEventListener('click', closeReviewDlg);
  reviewDlg.addEventListener('click', (e) => { if (e.target === reviewDlg) closeReviewDlg(); });
  document.getElementById('reviewSave').addEventListener('click', () => {
    if (!reviewBookId) return;
    const text = document.getElementById('reviewText').value.trim();
    setReview(reviewBookId, { rating: reviewRating || null, text: text || null });
    closeReviewDlg();
    renderShelf();
  });
  document.getElementById('reviewDelete').addEventListener('click', () => {
    if (!reviewBookId) return;
    setReview(reviewBookId, null);
    closeReviewDlg();
    renderShelf();
  });

  function wireTabs() {
    const tabs = document.querySelectorAll('#tabs .tab');
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        activeShelf = t.dataset.shelf;
        tabs.forEach(x => x.classList.toggle('active', x.dataset.shelf === activeShelf));
        renderShelf();
      });
    });
  }

  // ---------- swipe between tabs (mobile) ----------
  const SHELF_ORDER = ['reading', 'wantToRead', 'read'];
  function switchShelf(direction) {
    const idx = SHELF_ORDER.indexOf(activeShelf);
    const next = idx + direction;
    if (next < 0 || next >= SHELF_ORDER.length) return;
    activeShelf = SHELF_ORDER[next];
    document.querySelectorAll('#tabs .tab').forEach(t =>
      t.classList.toggle('active', t.dataset.shelf === activeShelf));
    renderShelf();
  }
  attachSwipe(document.querySelector('main'), {
    onLeft:  () => switchShelf(+1),  // swipe left → next tab
    onRight: () => switchShelf(-1),  // swipe right → prev tab
  });

  renderCounts();
  renderShelf();
  wireTabs();
</script>
</body>
</html>
