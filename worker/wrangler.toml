name = "chaptr-ask"
main = "index.js"
compatibility_date = "2024-09-23"

# After deploying:
#   npx wrangler secret put ANTHROPIC_API_KEY   # paste your Anthropic key
#
# For the V2 sync feature you also need a D1 database:
#   npx wrangler d1 create chaptr-db            # prints a database_id — paste below
#   npx wrangler d1 execute chaptr-db --remote --file=schema.sql
#   npx wrangler deploy
#
# Once you've created the D1 database, uncomment the binding block below and
# replace REPLACE_WITH_DATABASE_ID with the ID wrangler printed for you.

[vars]
# Phase 1C — Clerk JWT verification. The Worker fetches JWKS from this domain
# and rejects tokens issued elsewhere. Find this in your Clerk dashboard
# (Configure → Developers → Domains → Primary domain) or decode it from your
# publishable key. Safe to commit — it's already public via the publishable key.
CLERK_FRONTEND_API = "oriented-slug-17.clerk.accounts.dev"

# Polish — Claude rate limits.
# Per-IP cap: max number of Claude-powered requests one IP can make in a UTC day.
# Catches both anonymous and signed-in abuse.
USER_DAILY_CAP = "50"
# Global cap: hard ceiling across ALL traffic per UTC day. At ~$0.003/call this
# bounds your worst-case Anthropic spend to ~$3/day. Bump up as you scale.
GLOBAL_DAILY_CAP = "1000"

[[d1_databases]]
binding = "DB"
database_name = "chaptr-db"
database_id = "43d3758a-f6c6-4880-9116-f05e9c6c06bd"
